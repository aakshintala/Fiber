[package]
name = "hook-conversion-cost"
version = "0.0.0"
edition = "2021"

[dependencies]
mimalloc = { version = "0.1.52", optional = true }
tikv-jemallocator = { version = "0.7.0", optional = true }
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize"] }
serde_json = "1"

[profile.release]
debug = false

# Allocator comparison for #16: build with --features mimalloc or --features jemalloc.
[features]
mimalloc = ["dep:mimalloc"]
jemalloc = ["dep:tikv-jemallocator"]
