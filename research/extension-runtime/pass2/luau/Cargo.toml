# Own workspace: Cargo unifies mlua-sys features across a workspace, so lua54 +
# luau together are a compile_error (see pass1).
[workspace]

[package]
name = "stream-luau"
version = "0.0.0"
edition = "2021"

[dependencies]
mlua = { version = "0.12", features = ["luau", "vendored", "send", "serde"] }
serde_json = "1"

[profile.release]
debug = false
