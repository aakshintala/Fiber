name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Check if release needed
        id: check
        run: |
          VERSION=$(grep 'pub const version' src/main.zig | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::src/main.zig version is not strict SemVer"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} exists, no release needed"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} missing, release needed"
          fi

  build-linux:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux
          - name: linux-aarch64
            target: aarch64-linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Package
        run: |
          package_dir="$RUNNER_TEMP/fiber-package-${{ matrix.name }}"
          mkdir -p "$package_dir"
          cp zig-out/bin/fiber LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf fiber-${{ matrix.name }}.tar.gz -C "$package_dir" fiber LICENSE THIRD_PARTY_NOTICES.md
          sha256sum fiber-${{ matrix.name }}.tar.gz > fiber-${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fiber-${{ matrix.name }}
          path: |
            fiber-${{ matrix.name }}.tar.gz
            fiber-${{ matrix.name }}.tar.gz.sha256

  build-macos-arm64:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/pgso-macos-arm64.yml

  sign-macos-arm64:
    needs: [check-version, build-macos-arm64]
    if: needs.check-version.outputs.needed == 'true'
    name: Sign macos-arm64
    runs-on: macos-15
    environment: apple-signing
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Require native arm64 host
        run: test "$(uname -m)" = arm64

      - name: Download eligible candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pgso-evidence-macos-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/fiber-pgso-aggregate

      - name: Restore executable mode
        run: chmod +x "$RUNNER_TEMP/fiber-pgso-aggregate/candidate/fiber"

      - name: Confirm release eligibility
        run: python3 -m scripts.pgso report --output-dir "$RUNNER_TEMP/fiber-pgso-aggregate" >/dev/null

      - name: Sign and notarize stable release candidate
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: scripts/sign-and-notarize-macos.sh "$RUNNER_TEMP/fiber-pgso-aggregate/candidate/fiber"

      - name: Package stable release candidate
        run: |
          archive="$RUNNER_TEMP/fiber-macos-aarch64.tar.gz"
          package_dir="$RUNNER_TEMP/fiber-release-package"
          mkdir -p "$package_dir"
          cp "$RUNNER_TEMP/fiber-pgso-aggregate/candidate/fiber" LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf "$archive" -C "$package_dir" fiber LICENSE THIRD_PARTY_NOTICES.md
          cd "$RUNNER_TEMP"
          shasum -a 256 fiber-macos-aarch64.tar.gz > fiber-macos-aarch64.tar.gz.sha256

      - name: Upload stable release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fiber-macos-aarch64
          path: |
            ${{ runner.temp }}/fiber-macos-aarch64.tar.gz
            ${{ runner.temp }}/fiber-macos-aarch64.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: [check-version, build-linux, sign-macos-arm64]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: fiber-*
          merge-multiple: true

      - name: Create git tag
        env:
          RELEASE_TAG: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git tag -- "$RELEASE_TAG"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Extract changelog entry
        run: |
          awk '/<!-- release:start -->/{found=1; next} /<!-- release:end -->/{found=0} found{print}' CHANGELOG.md > /tmp/release-notes.md
          LINES=$(wc -l < /tmp/release-notes.md | tr -d ' ')
          if [ "$LINES" -lt 2 ]; then
            echo "Error: No release notes found between <!-- release:start --> and <!-- release:end --> markers in CHANGELOG.md"
            exit 1
          fi
          echo "Extracted release notes ($LINES lines)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          body_path: /tmp/release-notes.md
          files: |
            fiber-*.tar.gz
            fiber-*.tar.gz.sha256
