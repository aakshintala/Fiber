name: CI

# The only top-level PR and manual entrypoint. `push` is deliberately absent:
# `release.yml` owns `main`, and a branch without a pull request has nothing to
# gate. `ready_for_review` is not a default activity type; without it, marking a
# PR ready fires no run and the draft run's light-scope success would remain on
# the head commit as a satisfied required check.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"
  BUN_VERSION: "1.3.14"

jobs:
  # Scope planner: docs-only detection shared by the ready-scope jobs.
  # Runs on every event (~30s); workflow_dispatch is never docs-only.
  scope:
    name: Select CI scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect docs-only change
        id: detect
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          docs_only=true
          while IFS= read -r f; do
            case "$f" in
              # src/ Markdown is embedded in the binary (system_prompt.md).
              src/*) docs_only=false; break ;;
              *.md|docs/*) ;;
              *) docs_only=false; break ;;
            esac
          done < <(git diff --name-only "$base"...HEAD)
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Shellcheck Fiber scripts
        run: |
          scripts=(
            benchmarks/startup.sh
            scripts/check-public-surface.sh
            scripts/e2e-run-file.sh
          )
          bash -n "${scripts[@]}"
          shellcheck "${scripts[@]}"

  # Draft scope. Also the linux-x86_64 leg of the ready matrix, so ready runs do
  # not build and test this platform twice.
  # Cheap deterministic gates that must re-verify every push in every
  # scope (including ready pushes, where the heavy native job is skipped).
  # None of these need a built binary.
  static:
    name: Static gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup Zig
        uses: aakshintala/setup-zig@8e85b004ccca16ca97fd3105612eaa043b909f27
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: ci-static-ReleaseSafe

      - name: Check formatting
        run: zig fmt --check src/

      - name: Validate PGSO corpus classification
        run: python3 -m scripts.pgso.corpus --manifest scripts/pgso/corpus.json --list

      - name: Test the release decision
        run: python3 -m unittest scripts.tests.test_release_decision -v

      - name: Audit public surface
        run: ./scripts/check-public-surface.sh

      - name: Check core has no production builtins imports
        run: python3 scripts/check-core-builtins.py

  # Heavy native leg: build, unit tests, smoke. Runs once, in draft (and on
  # manual dispatch), except docs-only changes which need no binary. The
  # ready scope adds only net-new platforms. The static gates above still
  # run on every push in every scope.
  native-linux:
    name: Native checks (linux-x86_64)
    if: (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft != false) && needs.scope.outputs.docs_only != 'true'
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Setup Zig
        uses: aakshintala/setup-zig@8e85b004ccca16ca97fd3105612eaa043b909f27
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: ci-native-linux-x86_64-ReleaseSafe

      # `zig build test` depends on the install step, so it builds and installs
      # the exe as well. The build runner compiles the exe and the test binary
      # concurrently, and the exe is the shorter of the two, so folding them
      # into one invocation hides the exe build entirely.
      - name: Build and run unit tests
        env:
          TEST_TIMEOUT_SECONDS: "1200"
        run: |
          started_at=$SECONDS
          trap 'printf "Build and unit tests elapsed: %ss\n" "$((SECONDS - started_at))"' EXIT
          timeout "${TEST_TIMEOUT_SECONDS}s" zig build test -Doptimize=ReleaseSafe

      - name: Smoke test fresh binary
        run: ./scripts/smoke.sh

  native-extra:
    name: Native checks (${{ matrix.platform.name }})
    if: (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true'
    needs: scope
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-aarch64
            runner: macos-15
            # See the Build step below: this runner is slower when the two
            # compiles overlap, so it builds the exe first.
            serial_build: true
    steps:
      - uses: actions/checkout@v5

      # Diagnostic for the unexplained 10m to 14m30 spread in this job and the
      # serial_build timings above. Never fails the job.
      - name: Report runner hardware
        if: runner.os == 'macOS'
        run: sysctl hw.ncpu hw.physicalcpu hw.memsize machdep.cpu.brand_string; uptime; true

      - name: Setup Zig
        uses: aakshintala/setup-zig@8e85b004ccca16ca97fd3105612eaa043b909f27
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: ci-native-${{ matrix.platform.name }}-ReleaseSafe

      - name: Check formatting
        run: zig fmt --check src/

      - name: Audit public surface
        run: ./scripts/check-public-surface.sh

      # `zig build test` builds and installs the exe too, and the build runner
      # compiles the exe and the test binary concurrently. On the 4-core Linux
      # runners that hides the exe build entirely, measured at -3m38. On
      # macos-15-arm64 the overlap is slower than building serially, measured
      # at +2m13 against seven serial samples, so that platform builds first
      # and the test step reuses the cache.
      - name: Build
        if: matrix.platform.serial_build
        run: zig build -Doptimize=ReleaseSafe

      - name: Build and run unit tests
        run: zig build test -Doptimize=ReleaseSafe

      - name: Smoke test fresh binary
        run: ./scripts/smoke.sh

  # Draft runs Linux x86_64 E2E once. Ready adds only the net-new platforms.
  # Docs-only changes run nothing here in either scope (static gates still
  # verify them); a later push that adds code flips detection back to full
  # scope automatically. Manual dispatch runs everything. A planner job emits
  # that list so unneeded OS legs are never queued. This assumes the
  # documented flow: every PR opens as a draft, so draft scope has run
  # before ready.
  e2e-platforms:
    name: Select E2E platforms
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: scope
    outputs:
      platforms: ${{ steps.select.outputs.platforms }}
    steps:
      - name: Select platforms for this scope
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
        run: |
          set -euo pipefail
          linux='{"name":"linux-x86_64","runner":"ubuntu-24.04","zig_tarball":"zig-x86_64-linux"}'
          extra='[{"name":"linux-aarch64","runner":"ubuntu-24.04-arm","zig_tarball":"zig-aarch64-linux"},{"name":"macos-aarch64","runner":"macos-15","zig_tarball":"zig-aarch64-macos"}]'
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            platforms="$(jq -c --argjson linux "$linux" --argjson extra "$extra" -n '[$linux] + $extra')"
          elif [ "$DOCS_ONLY" = "true" ]; then
            platforms="[]"
          elif [ "$IS_DRAFT" = "false" ]; then
            platforms="$extra"
          else
            platforms="$(jq -c --argjson linux "$linux" -n '[$linux]')"
          fi
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"

  # The isolated MCP conformance package is its own npm project under
  # tests/e2e/conformance, so the root-level shard planner never discovers it.
  conformance:
    name: MCP conformance
    if: (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true'
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Setup Zig
        uses: aakshintala/setup-zig@8e85b004ccca16ca97fd3105612eaa043b909f27
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: ci-conformance-ReleaseSafe

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install isolated MCP conformance package
        run: npm ci
        working-directory: tests/e2e/conformance

      - name: Run isolated MCP conformance baseline
        run: npm test
        working-directory: tests/e2e/conformance
        env:
          FIBER_SOUND: "0"

  e2e:
    name: E2E (${{ matrix.platform.name }}, shard ${{ matrix.shard.label }})
    # An empty platform list (docs-only scope) fails matrix evaluation, so
    # skip the job instead; the aggregate passes on skipped jobs.
    if: needs.e2e-platforms.outputs.platforms != '[]'
    needs: e2e-platforms
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.e2e-platforms.outputs.platforms) }}
        shard:
          - index: 0
            shard_count: 3
            label: "1/3"
          - index: 1
            shard_count: 3
            label: "2/3"
          - index: 2
            shard_count: 3
            label: "3/3"
    env:
      FIBER_REQUIRE_TMUX: "1"
      SHARD_INDEX: ${{ matrix.shard.index }}
      SHARD_COUNT: ${{ matrix.shard.shard_count }}
      # Files within a shard run concurrently, each in its own tmux server.
      # Three lanes on a 4-vCPU runner leaves headroom; these tests are
      # latency-bound, so lanes overlap waiting rather than contend for CPU.
      E2E_LANES: "3"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: aakshintala/setup-zig@8e85b004ccca16ca97fd3105612eaa043b909f27
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Restore native Zig cache
        uses: actions/cache/restore@v5
        with:
          path: .zig-cache
          key: ci-e2e-read-only-${{ matrix.platform.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            setup-zig-cache-v2-native-${{ matrix.platform.zig_tarball }}-${{ env.ZIG_VERSION }}-ci-native-${{ matrix.platform.name }}-ReleaseSafe-

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install E2E system dependencies
        shell: bash
        # 17 for the shard plus headroom for one per-file retry.
        timeout-minutes: 22
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            missing=()
            command -v tmux >/dev/null 2>&1 || missing+=(tmux)
            command -v zsh >/dev/null 2>&1 || missing+=(zsh)
            if [ "${#missing[@]}" -gt 0 ]; then
              retry() {
                local attempt
                for attempt in 1 2; do
                  if "$@"; then
                    return 0
                  fi
                  if [ "$attempt" -lt 2 ]; then
                    printf 'Dependency install attempt %s failed; retrying in 5s\n' "$attempt" >&2
                    sleep 5
                  fi
                done
                return 1
              }
              # The Azure mirror can stall after APT has already fetched release
              # metadata from the direct Ubuntu fallback. Prefer that fallback
              # for the whole update when the runner's mirror list provides it.
              if [ -f /etc/apt/apt-mirrors.txt ] &&
                grep -Eq '^https?://(archive|ports)\.ubuntu\.com/' /etc/apt/apt-mirrors.txt
              then
                sudo sed -i '/:\/\/azure\..*ubuntu\.com\//d' /etc/apt/apt-mirrors.txt
              fi
              # tmux and zsh come from the Ubuntu archive, but the update
              # refreshes every source on the runner image, including
              # third-party lists we install nothing from. A stale mirror there
              # fails the whole command after the repositories we need have
              # already been fetched, and a retry five seconds later gets the
              # same answer. The install below is the real gate: it fails loudly
              # if the metadata it needs is actually missing.
              retry sudo timeout --kill-after=15s 4m apt-get \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                update || echo "apt-get update reported errors; continuing to install" >&2
              retry sudo timeout --kill-after=15s 3m apt-get \
                -o Dpkg::Use-Pty=0 \
                install -y "${missing[@]}"
            fi
          elif ! command -v tmux >/dev/null 2>&1; then
            brew install tmux
          fi
          printf 'set-option -g history-limit 100000\n' > "$HOME/.tmux.conf"
          tmux -V
          zsh --version

      - name: Install E2E dependencies
        run: bun install --frozen-lockfile
        working-directory: tests/e2e

      # One retry per file. Timing-sensitive TUI tests flake on loaded
      # runners; a blind failure blocks the lane on noise, but a silent
      # retry would destroy the evidence. So the retry is annotated (job
      # warning + step summary) and every passed-after-retry file must map
      # to a flake issue filed for deflaking by test rewrite, never by
      # rerunning. Deterministic jobs (build, unit tests, shellcheck) do
      # not retry: they are fast and a failure there is signal.
      - name: Run deterministic E2E shard
        shell: bash
        working-directory: tests/e2e
        run: |
          set -euo pipefail
          selection_file="$RUNNER_TEMP/fiber-e2e-shard-${SHARD_INDEX}.txt"
          bun ci-shards.ts \
            --shard-count "$SHARD_COUNT" \
            --shard-index "$SHARD_INDEX" > "$selection_file"

          selected=()
          while IFS= read -r test_file; do
            selected+=("$test_file")
          done < "$selection_file"
          test "${#selected[@]}" -gt 0

          printf 'Running E2E shard %s/%s (%s files, %s lanes):\n' \
            "$((SHARD_INDEX + 1))" "$SHARD_COUNT" "${#selected[@]}" "$E2E_LANES"
          printf '  %s\n' "${selected[@]}"

          # Files fan out across lanes, each in its own tmux server. The
          # runner script always exits 0 and records its outcome under
          # RESULTS_DIR, because `xargs -P` aborts the fan-out on a non-zero
          # child. Aggregation below owns this step's exit code.
          results_dir="$RUNNER_TEMP/fiber-e2e-results-${SHARD_INDEX}"
          rm -rf "$results_dir"
          mkdir -p "$results_dir"
          RESULTS_DIR="$results_dir" SHARD_INDEX="$SHARD_INDEX" \
            xargs -P "$E2E_LANES" -I{} \
            "$GITHUB_WORKSPACE/scripts/e2e-run-file.sh" {} < "$selection_file"

          # A missing status file means its lane died without recording an
          # outcome; that is a failure, never a silent pass.
          shard_status=0
          retried_files=()
          flake_entries=()
          for test_file in "${selected[@]}"; do
            slug="$(printf '%s' "$test_file" | tr -c '[:alnum:]' '-')"
            lane_dir="${results_dir}/${slug}"
            if [ ! -f "${lane_dir}/status" ]; then
              printf 'E2E shard %s: %s recorded no outcome\n' "$SHARD_INDEX" "$test_file" >&2
              shard_status=1
              continue
            fi
            if [ "$(cat "${lane_dir}/status")" != "0" ]; then
              shard_status=1
            fi
            if [ -f "${lane_dir}/retried" ]; then
              retried_files+=("$test_file")
            fi
            if [ -f "${lane_dir}/flakes" ]; then
              while IFS= read -r flake_entry; do
                [ -n "$flake_entry" ] || continue
                flake_entries+=("$flake_entry")
              done < "${lane_dir}/flakes"
            fi
          done

          if [ "${#retried_files[@]}" -gt 0 ]; then
            {
              printf 'E2E shard %s passed after retry (flaky; file a flake issue):\n' "$SHARD_INDEX"
              printf '  %s\n' "${retried_files[@]}"
              if [ "${#flake_entries[@]}" -gt 0 ]; then
                printf 'Failing tests on first attempt (from JUnit report):\n'
                printf '  %s\n' "${flake_entries[@]}"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Always written (possibly blank): flake-watch collects these. The
          # file-level contract is unchanged: one bare "<file>" line per
          # passed-after-retry file, then "<file>: <test name>" lines.
          : > "$RUNNER_TEMP/fiber-flake-retries.txt"
          if [ "${#retried_files[@]}" -gt 0 ]; then
            printf '%s\n' "${retried_files[@]}" >> "$RUNNER_TEMP/fiber-flake-retries.txt"
          fi
          if [ "${#flake_entries[@]}" -gt 0 ]; then
            printf '%s\n' "${flake_entries[@]}" >> "$RUNNER_TEMP/fiber-flake-retries.txt"
          fi
          exit "$shard_status"

      - name: Upload retry report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flake-retries-${{ matrix.platform.name }}-shard-${{ matrix.shard.index }}
          path: ${{ runner.temp }}/fiber-flake-retries.txt
          if-no-files-found: warn
          retention-days: 7

  # Non-blocking watcher: fails loudly when any shard passed after retry,
  # so green-with-retries stays visible. Deliberately NOT in the aggregate
  # CI job's needs: it must never block merging, only demand flake issues.
  flake-watch:
    name: Flake watch (non-blocking)
    if: always() && contains(fromJSON('["success", "failure"]'), needs.e2e.result)
    needs: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download retry reports
        uses: actions/download-artifact@v7
        with:
          pattern: flake-retries-*
          merge-multiple: true
          path: flake-retries
      - name: Fail on passed-after-retry
        shell: bash
        run: |
          flakes=$(grep -h . flake-retries/* 2>/dev/null || true)
          if [ -z "$flakes" ]; then
            echo "No E2E retries; nothing flaky observed."
            exit 0
          fi
          while IFS= read -r flake; do
            [ -n "$flake" ] || continue
            printf '::error::E2E passed after retry (flaky tests observed): %s\n' "$flake"
          done <<< "$flakes"
          echo "File or update a flake issue for each listed test (deflake by rewrite)."
          exit 1

  bench:
    name: Performance gates
    if: (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false) && needs.scope.outputs.docs_only != 'true'
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Setup Zig
        uses: aakshintala/setup-zig@8e85b004ccca16ca97fd3105612eaa043b909f27
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: ci-bench-ReleaseSafe

      - name: Build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe

      - name: Install hyperfine
        run: |
          wget -q https://github.com/sharkdp/hyperfine/releases/download/v1.19.0/hyperfine_1.19.0_amd64.deb
          sudo dpkg -i hyperfine_1.19.0_amd64.deb

      - name: Run benchmarks
        run: ./benchmarks/startup.sh --ci

      - name: Enforce latency budgets
        run: python3 benchmarks/check_budgets.py

      - name: Run UI activity progress benchmark
        run: |
          for run in 1 2 3; do
            zig build run-bench-ui-activity -Doptimize=ReleaseSafe
          done

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Run interactive terminal performance gate
        working-directory: tests/e2e
        env:
          FIBER_TUI_PERFORMANCE: "1"
          FIBER_TUI_PERFORMANCE_REPORT: ${{ runner.temp }}/tui-performance.json
        run: bun test tui-performance.test.ts

      - name: Upload interactive terminal performance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tui-performance
          path: ${{ runner.temp }}/tui-performance.json
          if-no-files-found: warn

  # Compares the head binary against the pull request's base, so it has no
  # meaning on a manual dispatch.
  binary-size:
    name: ReleaseSafe size delta (${{ matrix.name }})
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && needs.scope.outputs.docs_only != 'true'
    needs: scope
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux
            runner: ubuntu-24.04
            section_format: elf
            expected_file: "ELF 64-bit LSB.*x86-64"
          - name: linux-aarch64
            target: aarch64-linux
            runner: ubuntu-24.04-arm
            section_format: elf
            expected_file: "ELF 64-bit LSB.*ARM aarch64"
          # Cross-compiled from Linux. The job passes an explicit -Dtarget, so
          # the runner OS does not change what is built, and freeing this macOS
          # slot keeps ready scope under the five-job concurrency cap.
          - name: macos-aarch64
            target: aarch64-macos
            runner: ubuntu-24.04
            section_format: macho
            expected_macho_arch: arm64
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EXPECTED_FILE: ${{ matrix.expected_file }}
      EXPECTED_MACHO_ARCH: ${{ matrix.expected_macho_arch }}
      SECTION_FORMAT: ${{ matrix.section_format }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Zig
        uses: aakshintala/setup-zig@8e85b004ccca16ca97fd3105612eaa043b909f27
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: false

      - name: Test size reporter
        run: python3 -m unittest scripts.tests.test_binary_size -v

      - name: Build pull request binary
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/fiber-binary-size-evidence"
          mkdir -p "$evidence_dir"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          zig build \
            -Dtarget=${{ matrix.target }} \
            -Doptimize=ReleaseSafe \
            --cache-dir "$RUNNER_TEMP/fiber-head-cache" \
            --global-cache-dir "$RUNNER_TEMP/fiber-global-cache"
          cp zig-out/bin/fiber "$evidence_dir/head-fiber"
          # `size -m` and BSD `file` only exist on macOS. The Mach-O reader
          # checks the cpu type structurally, which is what the `file` regex
          # was approximating, and emits the same report `size -m` did.
          if [ "$SECTION_FORMAT" = "macho" ]; then
            python3 -m scripts.macho_sections \
              --expect-arch "$EXPECTED_MACHO_ARCH" \
              "$evidence_dir/head-fiber" > "$evidence_dir/head-sections.txt"
          else
            file "$evidence_dir/head-fiber" > "$evidence_dir/head-file.txt"
            cat "$evidence_dir/head-file.txt"
            grep -Eq "$EXPECTED_FILE" "$evidence_dir/head-file.txt"
            size -A -d "$evidence_dir/head-fiber" > "$evidence_dir/head-sections.txt"
          fi
          cat "$evidence_dir/head-sections.txt"

      - name: Build base binary
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/fiber-binary-size-evidence"
          base_worktree="$RUNNER_TEMP/fiber-binary-size-base"
          cleanup() {
            git worktree remove --force "$base_worktree" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM
          git worktree add --detach "$base_worktree" "$BASE_SHA"
          test "$(git -C "$base_worktree" rev-parse HEAD)" = "$BASE_SHA"
          (
            cd "$base_worktree"
            zig build \
              -Dtarget=${{ matrix.target }} \
              -Doptimize=ReleaseSafe \
              --cache-dir "$RUNNER_TEMP/fiber-base-cache" \
              --global-cache-dir "$RUNNER_TEMP/fiber-global-cache"
          )
          # The base may predate the current executable name, so compare
          # against whatever single executable it installs.
          base_bins=("$base_worktree"/zig-out/bin/*)
          if [ "${#base_bins[@]}" -ne 1 ] || [ ! -f "${base_bins[0]}" ]; then
            echo "expected one base executable, found: ${base_bins[*]}" >&2
            exit 1
          fi
          cp "${base_bins[0]}" "$evidence_dir/base-fiber"
          # `size -m` and BSD `file` only exist on macOS. The Mach-O reader
          # checks the cpu type structurally, which is what the `file` regex
          # was approximating, and emits the same report `size -m` did.
          if [ "$SECTION_FORMAT" = "macho" ]; then
            python3 -m scripts.macho_sections \
              --expect-arch "$EXPECTED_MACHO_ARCH" \
              "$evidence_dir/base-fiber" > "$evidence_dir/base-sections.txt"
          else
            file "$evidence_dir/base-fiber" > "$evidence_dir/base-file.txt"
            cat "$evidence_dir/base-file.txt"
            grep -Eq "$EXPECTED_FILE" "$evidence_dir/base-file.txt"
            size -A -d "$evidence_dir/base-fiber" > "$evidence_dir/base-sections.txt"
          fi
          cat "$evidence_dir/base-sections.txt"

      - name: Compare binary sizes
        id: size
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/fiber-binary-size-evidence"
          python3 -m scripts.binary_size \
            --base-binary "$evidence_dir/base-fiber" \
            --head-binary "$evidence_dir/head-fiber" \
            --base-sections "$evidence_dir/base-sections.txt" \
            --head-sections "$evidence_dir/head-sections.txt" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --target "$TARGET" \
            --warning-bytes 52429 \
            --output-json "$evidence_dir/report.json" \
            --output-markdown "$evidence_dir/report.md" \
            --github-output "$GITHUB_OUTPUT"
          cat "$evidence_dir/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate notable growth
        if: steps.size.outputs.warning == 'true'
        env:
          DELTA_BYTES: ${{ steps.size.outputs.delta_bytes }}
        run: |
          printf '%s\n' \
            "::warning title=Binary size increase::${TARGET} ReleaseSafe grew by ${DELTA_BYTES} bytes; inspect the retained section report."

      - name: Upload size evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: binary-size-evidence-${{ matrix.name }}-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/fiber-binary-size-evidence/report.json
            ${{ runner.temp }}/fiber-binary-size-evidence/report.md
            ${{ runner.temp }}/fiber-binary-size-evidence/base-file.txt
            ${{ runner.temp }}/fiber-binary-size-evidence/head-file.txt
            ${{ runner.temp }}/fiber-binary-size-evidence/base-sections.txt
            ${{ runner.temp }}/fiber-binary-size-evidence/head-sections.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload binaries for investigation
        if: steps.size.outputs.warning == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: binary-size-binaries-${{ matrix.name }}-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/fiber-binary-size-evidence/base-fiber
            ${{ runner.temp }}/fiber-binary-size-evidence/head-fiber
          compression-level: 0
          retention-days: 7

  # The single required check. `CI` on pull requests, `Manual CI` on dispatch:
  # GitHub matches a required check by name on the head commit and ignores which
  # event produced it, so a dispatch against a PR branch would otherwise post a
  # satisfying `CI` result. Evidence comes only from this run's `needs` edges.
  aggregate:
    name: ${{ github.event_name == 'pull_request' && 'CI' || 'Manual CI' }}
    if: always()
    needs:
      - shellcheck
      - scope
      - static
      - native-linux
      - native-extra
      - conformance
      - e2e-platforms
      - e2e
      - bench
      - binary-size
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject failed or cancelled jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RESULTS"
          if printf '%s' "$RESULTS" |
            jq -e 'to_entries
                   | map(select(.value.result == "failure"
                             or .value.result == "cancelled"))
                   | length > 0' >/dev/null
          then
            printf '%s' "$RESULTS" |
              jq -r 'to_entries
                     | .[]
                     | select(.value.result == "failure"
                           or .value.result == "cancelled")
                     | "::error::job \(.key) reported \(.value.result)"'
            exit 1
          fi
          echo "All selected jobs succeeded or were skipped."
