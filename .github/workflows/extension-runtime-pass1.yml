# TEMPORARY. Runs the issue #11 pass-1 probe on Linux x86_64 and arm64, because
# every figure in research/extension-runtime/pass1 was taken on macOS arm64 and
# Linux carries the usage weight. Delete this file once #11 is resolved; #16
# owns Fiber's real CI.
name: extension-runtime-pass1

on:
  workflow_dispatch:
  push:
    branches: [extension-runtime-11]
    paths:
      - 'research/extension-runtime/**'
      - '.github/workflows/extension-runtime-pass1.yml'

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and platform facts
        run: |
          rustc --version
          uname -srm
          getconf PAGESIZE
          ldd --version | head -1 || true
      - name: Run the probe
        working-directory: research/extension-runtime/pass1
        run: ./measure.sh
